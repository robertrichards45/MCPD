<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% if config.GOOGLE_SITE_VERIFICATION %}<meta name="google-site-verification" content="{{ config.GOOGLE_SITE_VERIFICATION }}" />{% endif %}
  <title>{{ title if title else 'MCPD Portal' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='2026-05-09-live-stability') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/command-hybrid.css', v='2026-05-16-command-hybrid-v2') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-refresh.css', v='2026-05-16-mobile-refresh-v1') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app-patch.css', v='2026-05-18-layout-tighten-v1') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/command-final.css', v='2026-05-18-audit1') }}" />
  {% block head %}{% endblock %}
</head>
<body class="{{ body_class|default('') }}">{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/command_readiness.js', v='2026-05-16-command') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
