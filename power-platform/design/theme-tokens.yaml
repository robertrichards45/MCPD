theme:
  name: MCPD Sentinel Dark
  baseline: approved_2026_09_26_build_spec

  colors:
    app_background: "#07111F"
    shell_background: "#0A1624"
    card_background: "#10243A"
    card_raised: "#10243A"
    border: "#1D3A52"
    primary: "#1593FF"
    primary_hover: "#35A4FF"
    text_primary: "#FFFFFF"
    text_secondary: "#B8C7D9"
    text_muted: "#7F91A6"
    success: "#2BC66D"
    warning: "#F2B84B"
    danger: "#F05B63"
    info: "#37A7FF"

  typography:
    font_family: "Segoe UI"
    fallback: "Arial"
    sizes:
      page_title: 28
      section_title: 20
      card_title: 15
      body: 14
      metadata: 12
      metric: 30

  radius:
    small: 6
    standard: 10
    card: 12

  spacing:
    xs: 4
    sm: 8
    md: 12
    lg: 20
    xl: 28

  desktop:
    header_height: 64
    sidebar_width: 224
    content_gutter: 24

  component_defaults:
    card_border_width: 1
    button_height: 40
    input_height: 40
    nav_item_height: 44

  accessibility:
    critical_status_requires_text: true
    keyboard_focus_visible: true
    minimum_touch_target: 40
    avoid_color_only_meaning: true
