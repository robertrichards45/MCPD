security_profiles:
  personnel:
    ownership: user_or_team
    access_rule: Own profile/contact records and explicitly authorized personnel staff; expose a minimal
      directory projection separately.
  identity_admin:
    ownership: user_or_team
    access_rule: Identity administrators manage grants; role rows do not themselves confer Dataverse privileges.
  personal:
    ownership: user_or_team
    access_rule: Owner plus explicit task/form recipients; sharing must not bypass the linked record scope.
  configuration:
    ownership: organization
    access_rule: Authorized configuration managers write; app users read non-sensitive published configuration.
  system_configuration:
    ownership: organization
    access_rule: System configuration administrators only; ConfigValue must never contain credentials.
  fto_assignment:
    ownership: user_or_team
    access_rule: Trainee, assigned FTO, authorized supervisor and FTO coordinator within assignment scope;
      only authorized FTO/supervisor actions finalize ratings/reviews.
  training:
    ownership: user_or_team
    access_rule: Participant sees own attendance/signature/qualification; training managers manage scoped
      events and rosters; roster access does not expose other participants signatures.
  report:
    ownership: user_or_team
    access_rule: Report owner, authorized co-authors and assigned reviewers; all child rows receive explicit
      report-team permissions.
  form:
    ownership: user_or_team
    access_rule: Owner and explicit Personal/Team/Department recipients, intersected with report authorization
      when linked.
  reference:
    ownership: user_or_team
    access_rule: Source managers maintain versions; approved audiences read published sources; drafts/retired
      sources cannot be used as current grounding.
  scenario_definition:
    ownership: user_or_team
    access_rule: FTO/scenario authors only for raw definition; trainees receive a sanitized dispatch/scene
      projection from the runtime.
  scenario_run:
    ownership: user_or_team
    access_rule: Assigned trainee receives only visible runtime output; FTO/reviewer accesses evaluator
      content; secure hidden columns before any trainee access.
  watch:
    ownership: user_or_team
    access_rule: Authorized watch/operations teams; Assistant Operations receives explicitly assigned
      operational scope, never automatic case or admin privileges.
  announcement:
    ownership: user_or_team
    access_rule: Publisher controls write; read shares follow Personal/Team/Department audience, including
      inactive drafts.
  armory:
    ownership: user_or_team
    access_rule: Authorized armory team only; assigning an asset to an officer does not grant inventory
      or transaction administration.
  rfi:
    ownership: user_or_team
    access_rule: Authorized RFI team only; officer-specific projections require explicit grants.
  gate:
    ownership: user_or_team
    access_rule: Authorized gate team only; visitor identity is not department-wide directory data.
  inspection:
    ownership: user_or_team
    access_rule: Inspector and authorized inspection reviewers; child records match the inspection access
      scope.
  performance:
    ownership: user_or_team
    access_rule: Employee and assigned performance supervisor; command summaries do not grant unrestricted
      evaluation access.
  activity:
    ownership: user_or_team
    access_rule: Officer and authorized team supervisor; analytics must apply equivalent row-level scope.
  media:
    ownership: user_or_team
    access_rule: Explicit media/evidence custodians and authorized report participants only after deployment
      approval.
  ai_metadata:
    ownership: user_or_team
    access_rule: Requester and authorized reviewers; hashes and source IDs only, no raw prompt/output
      or credentials.
  learning:
    ownership: user_or_team
    access_rule: Submitter and assigned learning reviewers; approval is required before promotion to source
      material.
  exchange:
    ownership: user_or_team
    access_rule: Requester and authorized exchange operators; job authorization never expands source-record
      privileges.
  audit:
    ownership: organization
    access_rule: Trusted service writes append-only events; designated auditors read; ordinary app roles
      cannot update or delete.
