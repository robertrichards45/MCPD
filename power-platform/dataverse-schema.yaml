tables:

  DepartmentProfile:
    primary_name: DisplayName
    columns:
      EntraObjectId: text
      EmployeeId: text
      OfficerNumber: text
      FirstName: text
      LastName: text
      RankTitle: text
      Email: text
      SectionUnit: text
      Installation: text
      Supervisor: lookup:DepartmentProfile
      Active: yesno
      PendingApproval: yesno
      IsDemo: yesno
    ownership: organization

  RoleAssignment:
    primary_name: RoleName
    columns:
      Person: lookup:DepartmentProfile
      RoleKey: choice
      Active: yesno
      EffectiveDate: date
      ExpirationDate: date
    ownership: organization

  SavedWork:
    primary_name: Title
    columns:
      OwnerProfile: lookup:DepartmentProfile
      WorkType: choice
      Status: choice
      PayloadJson: multiline
      AccessScope: choice
      LastSavedAt: datetime
      SubmittedAt: datetime
    ownership: user_or_team

  FormDefinition:
    primary_name: Title
    columns:
      Category: text
      VersionLabel: text
      RetentionMode: choice
      ContainsPII: yesno
      AllowCompletedSave: yesno
      AllowDownload: yesno
      AllowEmail: yesno
      Active: yesno
      DocumentUrl: url
      ConfigurationJson: multiline
    ownership: organization

  CallTypeRule:
    primary_name: CallType
    columns:
      Category: text
      OfficerPaperworkJson: multiline
      WrittenStatementRule: multiline
      EvidenceRule: multiline
      CIDRule: multiline
      SupervisorRule: multiline
      ReferencesJson: multiline
      Active: yesno
    ownership: organization

  TrainingAssignment:
    primary_name: AssignmentName
    columns:
      Trainee: lookup:DepartmentProfile
      PrimaryFTO: lookup:DepartmentProfile
      Supervisor: lookup:DepartmentProfile
      ProgramType: choice[Standard8Week,Accelerated4Week,Custom]
      StartDate: date
      EstimatedCompletionDate: date
      ActualCompletionDate: date
      CurrentPhase: choice
      CurrentWeek: whole
      Status: choice[Planned,Active,Held,Completed,Terminated]
    ownership: organization

  DOR:
    primary_name: DORTitle
    columns:
      TrainingAssignment: lookup:TrainingAssignment
      Trainee: lookup:DepartmentProfile
      FTO: lookup:DepartmentProfile
      Supervisor: lookup:DepartmentProfile
      ObservationDate: date
      Phase: choice
      Week: whole
      Shift: choice
      NarrativeComments: multiline
      Status: choice[Draft,SubmittedToTrainee,TraineeAcknowledged,SubmittedToSupervisor,Approved,Returned]
      FTOCompletedAt: datetime
      TraineeAcknowledgedAt: datetime
      SupervisorReviewedAt: datetime
      TraineeComments: multiline
      SupervisorComments: multiline
    ownership: organization

  DORRating:
    primary_name: RatingLabel
    columns:
      DOR: lookup:DOR
      CategoryKey: text
      CategoryName: text
      Observed: yesno
      Rating: whole
      Comments: multiline
      RemedialRequired: yesno
    ownership: organization

  TaskBookItem:
    primary_name: TaskName
    columns:
      TaskCode: text
      Category: text
      Phase: choice
      Description: multiline
      RequiredProgramTypes: multichoice
      SortOrder: whole
      Active: yesno
    ownership: organization

  TaskBookProgress:
    primary_name: ProgressTitle
    columns:
      TrainingAssignment: lookup:TrainingAssignment
      Task: lookup:TaskBookItem
      Trainee: lookup:DepartmentProfile
      FTO: lookup:DepartmentProfile
      Status: choice[NotStarted,Observed,Assisted,PerformedSatisfactorily,Completed]
      ObservationDate: date
      Comments: multiline
      CompletedAt: datetime
    ownership: organization

  RemedialTraining:
    primary_name: RemedialTitle
    columns:
      TrainingAssignment: lookup:TrainingAssignment
      DOR: lookup:DOR
      Trainee: lookup:DepartmentProfile
      AssignedBy: lookup:DepartmentProfile
      Category: text
      Deficiency: multiline
      TrainingPlan: multiline
      DueDate: date
      Status: choice[Open,InProgress,ReadyForReevaluation,Closed]
      ReevaluationResult: multiline
      ClosedAt: datetime
    ownership: organization

  WeeklyEvaluation:
    primary_name: EvaluationTitle
    columns:
      TrainingAssignment: lookup:TrainingAssignment
      Trainee: lookup:DepartmentProfile
      Evaluator: lookup:DepartmentProfile
      WeekNumber: whole
      Phase: choice
      Strengths: multiline
      Deficiencies: multiline
      Recommendations: multiline
      Status: choice[Draft,Submitted,Approved]
    ownership: organization

  PhaseEvaluation:
    primary_name: EvaluationTitle
    columns:
      TrainingAssignment: lookup:TrainingAssignment
      Trainee: lookup:DepartmentProfile
      Evaluator: lookup:DepartmentProfile
      Phase: choice
      Summary: multiline
      Recommendation: choice[Advance,Extend,Remedial,Terminate]
      Status: choice[Draft,Submitted,Approved]
    ownership: organization

  TrainingEvent:
    primary_name: Title
    columns:
      Description: multiline
      TrainingDate: datetime
      DueDate: date
      Category: text
      RequiredAudienceJson: multiline
      Status: choice
    ownership: organization

  TrainingAttendance:
    primary_name: AttendanceTitle
    columns:
      TrainingEvent: lookup:TrainingEvent
      Person: lookup:DepartmentProfile
      Status: choice[Assigned,Completed,Excused,Overdue]
      CompletedAt: datetime
      Comments: multiline
    ownership: organization

  ReportRecord:
    primary_name: ReportTitle
    columns:
      OwnerProfile: lookup:DepartmentProfile
      ReportType: choice
      CCN: text
      Status: choice[Draft,Submitted,Returned,Resubmitted,Approved,Closed]
      NarrativeHash: text
      RevisionNumber: whole
      ParentRevision: lookup:ReportRecord
      Reviewer: lookup:DepartmentProfile
      ReviewComments: multiline
      FindingCount: whole
      SubmittedAt: datetime
      ReviewedAt: datetime
    ownership: user_or_team

  Notice:
    primary_name: Title
    columns:
      Message: multiline
      Scope: choice
      Active: yesno
      EffectiveFrom: datetime
      EffectiveTo: datetime
      CreatedByProfile: lookup:DepartmentProfile
    ownership: organization

  AuditEvent:
    primary_name: Action
    columns:
      Actor: lookup:DepartmentProfile
      RecordType: text
      RecordIdText: text
      Details: multiline
      EventAt: datetime
    ownership: organization

  DORRatingCategory:
    primary_name: CategoryName
    columns:
      CategoryNumber: whole
      CategoryGroup: choice[Appearance,Attitude,Knowledge,Performance,Relationships]
      ScaleMin: whole
      ScaleAcceptable: whole
      ScaleMax: whole
      AllowNotObserved: yesno
      Active: yesno
      SortOrder: whole
    ownership: organization

  SourceDocument:
    primary_name: Title
    columns:
      SourceType: choice[Policy,Order,PDI,Manual,Law,TrainingReference,Other]
      VersionLabel: text
      EffectiveDate: date
      ExpirationDate: date
      Status: choice[Draft,Approved,Retired]
      IssuingAuthority: text
      ApprovedByProfile: lookup:DepartmentProfile
      ApprovedAt: datetime
      Supersedes: lookup:SourceDocument
      DocumentUrl: url
      FileHash: text
      ActiveForGrounding: yesno
    ownership: organization

  SourcePassage:
    primary_name: PassageLabel
    columns:
      SourceDocument: lookup:SourceDocument
      PageNumber: whole
      SectionLabel: text
      PassageText: multiline
      SearchText: multiline
      Active: yesno
    ownership: organization

  ReportFinding:
    primary_name: FindingTitle
    columns:
      ReportRecord: lookup:ReportRecord
      FindingType: choice[Completeness,Consistency,DocumentationCue,PacketRequirement,SourceMatch,Other]
      Severity: choice[Info,Review,Correction]
      AutomatedCue: multiline
      SourceDocument: lookup:SourceDocument
      SourcePassage: lookup:SourcePassage
      SourceCitation: multiline
      HumanDisposition: choice[Unreviewed,Accepted,Rejected,Corrected,NotApplicable]
      HumanComments: multiline
      CreatedAt: datetime
    ownership: organization

  ScenarioDefinition:
    primary_name: Title
    columns:
      ScenarioCode: text
      Family: text
      VersionLabel: text
      Status: choice[Draft,Approved,Retired]
      Difficulty: choice[Introductory,Intermediate,Advanced]
      EvaluationModeAllowed: yesno
      CoachingModeAllowed: yesno
      Randomizable: yesno
      ScenarioJson: multiline
      ApprovedByProfile: lookup:DepartmentProfile
      ApprovedAt: datetime
      Active: yesno
    ownership: organization

  ScenarioRun:
    primary_name: RunTitle
    columns:
      Scenario: lookup:ScenarioDefinition
      Trainee: lookup:DepartmentProfile
      AssignedFTO: lookup:DepartmentProfile
      TrainingAssignment: lookup:TrainingAssignment
      Mode: choice[Evaluation,Coaching,Remedial,Shift]
      RunSeed: text
      StartedAt: datetime
      EndedAt: datetime
      Status: choice[NotStarted,Active,Ended,SubmittedForReview,Reviewed,Closed]
      CurrentSimulationTime: datetime
      CurrentLocationLabel: text
      WorldStateJson: multiline
      EvaluatorStateJson: multiline
      TranscriptRetentionAllowed: yesno
    ownership: organization

  ScenarioAction:
    primary_name: ActionLabel
    columns:
      ScenarioRun: lookup:ScenarioRun
      SequenceNumber: whole
      ActorType: choice[Trainee,Dispatch,NPC,System,FTO]
      ActorLabel: text
      RawTraineeText: multiline
      StructuredActionJson: multiline
      VisibleResultText: multiline
      HiddenEvaluatorResultJson: multiline
      SimulationTime: datetime
      CreatedAt: datetime
    ownership: organization

  ScenarioEvidence:
    primary_name: EvidenceLabel
    columns:
      ScenarioRun: lookup:ScenarioRun
      EvidenceType: text
      SourceLabel: text
      LocationLabel: text
      DiscoveryCondition: multiline
      PreservationState: choice[Unknown,Available,Preserved,Collected,Transferred,Lost]
      CollectionState: choice[NotObserved,Observed,Requested,Collected,Transferred]
      StructuredDataJson: multiline
      VisibleToTrainee: yesno
    ownership: organization

  ScenarioNotification:
    primary_name: NotificationLabel
    columns:
      ScenarioRun: lookup:ScenarioRun
      NotificationType: choice[Dispatch,Supervisor,CID,EMS,Fire,Gate,Other]
      Required: yesno
      TriggerCondition: multiline
      Completed: yesno
      CompletedAt: datetime
      CompletionAction: lookup:ScenarioAction
      EvaluatorComments: multiline
    ownership: organization

  ScenarioPaperwork:
    primary_name: PaperworkLabel
    columns:
      ScenarioRun: lookup:ScenarioRun
      FormDefinition: lookup:FormDefinition
      Required: yesno
      RequirementReason: multiline
      Status: choice[NotStarted,Draft,Submitted,Reviewed,Returned,Accepted]
      SavedWork: lookup:SavedWork
      Reviewer: lookup:DepartmentProfile
      ReviewComments: multiline
    ownership: organization

  CompetencyObservation:
    primary_name: ObservationTitle
    columns:
      ScenarioRun: lookup:ScenarioRun
      Trainee: lookup:DepartmentProfile
      CategoryNumber: whole
      CategoryName: text
      EvidenceJson: multiline
      DraftRating: whole
      FinalRating: whole
      FinalizedBy: lookup:DepartmentProfile
      RemedialRecommended: yesno
    ownership: organization

  ActionItem:
    primary_name: Title
    columns:
      AssignedTo: lookup:DepartmentProfile
      ActionType: choice[DORAcknowledgment,DORReview,ReportCorrection,RemedialTraining,TrainingDue,PhaseReview,ScenarioReview,Other]
      RelatedRecordType: text
      RelatedRecordIdText: text
      DueDate: datetime
      Status: choice[Open,InProgress,Completed,Cancelled]
      Priority: choice[Normal,High,Urgent]
      CreatedAt: datetime
      CompletedAt: datetime
    ownership: user_or_team

  AppConfiguration:
    primary_name: ConfigKey
    columns:
      ConfigValue: multiline
      ValueType: choice[Text,Boolean,Number,Json]
      EnvironmentSpecific: yesno
      Description: multiline
      Active: yesno
    ownership: organization

