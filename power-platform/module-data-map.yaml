version: 1
scope: Table-level coverage only; not proof that every feature is implemented.
external_stores:
  reports:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_AttachmentsLibraryName
    locator_columns:
    - ReportAttachment.StorageUrl
    - AccidentCase.ExportPacketUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  forms:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_AttachmentsLibraryName
    locator_columns:
    - FormDefinition.DocumentUrl
    - FormInstance.OutputDocumentUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  references:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_OrdersLibraryName
    locator_columns:
    - SourceDocument.DocumentUrl
    - ReferenceMaterial.DocumentUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  training_documents:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_AttachmentsLibraryName
    locator_columns:
    - QualificationRecord.DocumentUrl
    - TrainingRoster.SourceDocumentUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  operational_documents:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_AttachmentsLibraryName
    locator_columns:
    - BOLO.PhotoUrl
    - RFIAppointmentLetter.DocumentUrl
    - VehicleInspection.PdfOutputUrl
    - VehicleInspectionItem.PhotoUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  exchange_staging:
    provider: approved_sharepoint_library
    environment_variables:
    - mcpd_SharePointDocumentSiteUrl
    - mcpd_AttachmentsLibraryName
    locator_columns:
    - DataExchangeJob.SourceOrOutputUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: approved_storage_and_acl_validation
  evidence_media:
    provider: approved_evidence_system
    environment_variables:
    - mcpd_EvidenceMediaStoreId
    locator_columns:
    - BodycamMedia.StorageUrl
    access_rule: Authorize against the linked record and apply equivalent storage ACLs; a URL is not an
      access grant.
    retention_rule: Coordinate disposition with the linked record, including legal hold; no orphaned files
      or metadata.
    deployment_gate: evidence_and_cyber_approval
