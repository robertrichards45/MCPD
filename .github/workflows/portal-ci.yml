name: MCPD Portal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fto-center-*"]

permissions:
  contents: read

jobs:
  portal-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
      REQUIRE_PERSISTENT_DATABASE: "0"
      DATABASE_URL: sqlite:////tmp/mcpd-ci.db
      SECRET_KEY: mcpd-ci-only-not-production
      LEGAL_AI_EXPANSION_ENABLED: "0"
      ORDERS_AI_ASSIST_ENABLED: "0"
      LEGAL_QUERY_LOG_ENABLED: "0"
      PYTHONPATH: .
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python source
        run: python -m compileall -q app

      - name: Verify application routes load
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          endpoints = {rule.endpoint for rule in app.url_map.iter_rules()}
          required = {
              'reports.sentinel.report_inspector',
              'reports.sentinel.fto_center',
              'reports.sentinel.fto_program.dashboard',
              'reports.sentinel.fto_program.assignment',
              'reports.fto_refinements.edit_dor',
              'reports.fto_refinements.scenario_lab.lab',
              'reports.fto_refinements.scenario_lab.evaluator',
              'reports.fto_refinements.scenario_lab.review',
              'reports.fto_refinements.scenario_shift.shift',
              'reports.sentinel.portal_search',
              'reports.accidents',
              'bodycam.narrative_tool',
              'forms.call_type_rules_manager',
          }
          missing = sorted(required - endpoints)
          if missing:
              raise SystemExit(f'Missing required endpoints: {missing}')
          print(f'Loaded {len(endpoints)} endpoints; required MCPD workflow endpoints are present.')
          PY

      - name: Verify production database guard
        run: python -m pytest -q app/tests/test_production_database_guard.py

      - name: Run Sentinel workflow regression tests
        run: python -m pytest -q app/tests/test_sentinel_integration.py

      - name: Run Scenario Lab quality-gate tests
        run: python -m pytest -q app/tests/test_scenario_lab_quality_gate.py

      - name: Run Scenario Lab live branching tests
        run: python -m pytest -q app/tests/test_scenario_lab_live_training.py

      - name: Run Scenario Lab simulator platform tests
        run: python -m pytest -q app/tests/test_scenario_lab_simulator_platform.py

      - name: Run Virtual Shift and structured truth tests
        run: python -m pytest -q app/tests/test_virtual_shift_truth.py

      - name: Run Scenario Lab adaptive state-engine tests
        run: python -m pytest -q app/tests/test_scenario_state_engine.py

      - name: Run Scenario Lab FTO alert test
        run: python -m pytest -q app/tests/test_scenario_lab_fto_alert.py

      - name: Run retired-module regression tests
        run: python -m pytest -q app/tests/test_retired_modules.py

      - name: Run FTO Center program regression tests
        run: python -m pytest -q app/tests/test_fto_program_workflow.py

      - name: Run Call Type Paperwork regression tests
        run: python -m pytest -q app/tests/test_call_type_rules_manager.py

      - name: Run accident workflow regression tests
        run: python -m pytest -q app/tests/test_accident_tools_routing.py
